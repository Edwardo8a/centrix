name: CI Pipeline

on:
  push:
    branches:
      - "main"
      - "dev"
      - "sprint"
  pull_request:
    branches:
      - "main"
      - "dev"
      - "sprint"
  workflow_dispatch:

jobs:
  ci:
    name: Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Verify App Syntax Initialization
        run: |
          node -e "const app = require('./src/app'); console.log('CI verification: Express App initialized successfully');"